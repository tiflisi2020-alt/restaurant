<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1c1712" />
  <title>ადმინ შესვლა — რესტორანი ტიფლისი</title>
  <script>
    (function () {
      if (sessionStorage.getItem('tiflis_admin_logged') !== '1') return;
      var p = (location.pathname || '/').replace(/\/+$/, '') || '/';
      var base = p.replace(/\/admin(\/index\.html)?$/i, '');
      var panel = base + '/admin/panel';
      if (location.hostname.indexOf('github.io') !== -1) panel += '/';
      location.replace(panel);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,400&family=DM+Sans:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="../favicon.ico" type="image/x-icon" sizes="any" />
  <link rel="apple-touch-icon" href="../icon-192.png" />
  <style>
    :root {
      --ink: #2a2218;
      --ink-deep: #14110e;
      --cream: #f7f2ea;
      --card: #fffdf8;
      --teal: #3a948c;
      --teal-dark: #2a726b;
      --gold: #c9a03d;
      --muted: #8a7d6e;
      --line: rgba(42, 34, 24, 0.12);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-display: 'Cormorant', 'Noto Serif Georgian', Georgia, serif;
      --font-ui: 'DM Sans', 'Noto Sans Georgian', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(1.25rem, env(safe-area-inset-top))
        max(1.1rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom))
        max(1.1rem, env(safe-area-inset-left));
      font-family: var(--font-ui);
      color: var(--ink);
      color-scheme: dark;
      background:
        radial-gradient(ellipse 90% 70% at 12% 8%, rgba(58, 148, 140, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 55% at 92% 88%, rgba(201, 160, 61, 0.14), transparent 50%),
        linear-gradient(155deg, #1c1712 0%, #2a2218 48%, #151210 100%);
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      mix-blend-mode: soft-light;
    }
    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 26rem;
      animation: rise 0.7s var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand {
      text-align: center;
      margin-bottom: 1.35rem;
    }
    .brand-logo {
      width: 5.5rem;
      height: 5.5rem;
      margin: 0 auto 0.85rem;
      border-radius: 1rem;
      object-fit: contain;
      object-position: center;
      background: #fffdf8;
      border: 1px solid rgba(247, 242, 234, 0.35);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      display: block;
    }
    .brand-name {
      font-family: var(--font-display);
      font-size: clamp(2rem, 7vw, 2.55rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: var(--cream);
    }
    .brand-name em {
      font-style: italic;
      color: var(--gold);
      font-weight: 500;
    }
    .brand-kicker {
      margin-top: 0.45rem;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(247, 242, 234, 0.55);
      font-weight: 500;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 253, 248, 0.12);
      border-radius: 1.15rem;
      padding: 1.55rem 1.35rem 1.25rem;
      box-shadow:
        0 28px 64px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(42, 34, 24, 0.04) inset;
      animation: rise 0.75s var(--ease) 0.08s both;
    }
    .card h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.55rem;
      color: var(--ink);
      text-align: center;
      margin-bottom: 0.3rem;
      letter-spacing: -0.02em;
    }
    .sub {
      text-align: center;
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 1.35rem;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    input[type="password"] {
      width: 100%;
      min-height: 48px;
      padding: 0.8rem 0.95rem;
      background: #f3eee6;
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      color: var(--ink);
      font-family: inherit;
      font-size: 16px;
      margin-bottom: 0.85rem;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s;
    }
    input:focus {
      outline: none;
      border-color: rgba(58, 148, 140, 0.55);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(58, 148, 140, 0.18);
    }
    button[type="submit"] {
      width: 100%;
      min-height: 48px;
      padding: 0.8rem 1rem;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
      color: #fffdf8;
      border: none;
      border-radius: 0.7rem;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(58, 148, 140, 0.32);
      transition: transform 0.2s var(--ease), box-shadow 0.25s var(--ease), filter 0.2s;
    }
    button[type="submit"]:hover {
      filter: brightness(1.05);
      box-shadow: 0 14px 32px rgba(58, 148, 140, 0.4);
    }
    button[type="submit"]:active { transform: scale(0.985); }
    button[type="submit"]:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .err {
      display: none;
      font-size: 0.78rem;
      color: #b54a3c;
      margin-top: 0.85rem;
      text-align: center;
    }
    .err.show { display: block; }
    .back {
      display: block;
      text-align: center;
      margin-top: 1.15rem;
      font-size: 0.78rem;
    }
    .back a {
      color: rgba(247, 242, 234, 0.62);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back a:hover { color: var(--cream); }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 1.15rem 0 0.9rem;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    #google-btn-host {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 44px;
    }
    #google-err {
      display: none;
      font-size: 0.75rem;
      color: #b54a3c;
      margin-top: 0.65rem;
      text-align: center;
      line-height: 1.45;
    }
    #google-section { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .shell, .card { animation: none; }
      button[type="submit"] { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <img class="brand-logo" src="../icon-192.png?v=20261026w" width="88" height="88" alt="ტიფლისი" decoding="async" />
      <div class="brand-name">რესტორანი <em>ტიფლისი</em></div>
      <p class="brand-kicker">Admin</p>
    </header>

    <div class="card">
      <h1>ადმინ შესვლა</h1>
      <p class="sub">პაროლი ან Google — შემდეგ პანელი</p>
      <form id="login-form" autocomplete="on">
        <label for="pw">პაროლი</label>
        <input type="password" id="pw" name="password" autocomplete="current-password" required />
        <button type="submit" id="btn">შესვლა</button>
        <p class="err" id="err" role="alert">პაროლი არასწორია</p>
      </form>
      <div id="google-section">
        <div class="login-divider">ან Google</div>
        <div id="google-btn-host"></div>
        <p id="google-err" role="alert"></p>
      </div>
    </div>

    <p class="back"><a href="../">← მთავარი გვერდი</a></p>
  </div>
  <script>
    const SUPA_URL = '/api/legacy';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjeHprZWx2cG15bnJlZXdmbHJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDUwMTksImV4cCI6MjA4OTMyMTAxOX0.swcXV9m5g9Ox1t_QkLz_9suVTnBPanG0QxA1Eo4H-rY';
    const ADMIN_PW_DEFAULT = 'tiflis2024';

    async function supaFetch(path, method = 'GET', body = null) {
      const opts = {
        method,
        headers: {
          apikey: SUPA_KEY,
          Authorization: 'Bearer ' + SUPA_KEY,
          'Content-Type': 'application/json',
          Prefer: 'return=representation',
        },
      };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(SUPA_URL + path, opts);
      const text = await r.text();
      let data = null;
      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          data = { message: text };
        }
      }
      if (!r.ok) {
        const msg =
          (data && (data.message || data.error_description || data.hint)) ||
          r.statusText ||
          'HTTP ' + r.status;
        throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
      }
      return data;
    }

    async function getAdminPw() {
      try {
        const data = await supaFetch('/rest/v1/settings?key=eq.admin_pw&select=value');
        if (data && data[0] && data[0].value) return data[0].value;
      } catch (e) {}
      try {
        return localStorage.getItem('tiflis_admin_pw') || ADMIN_PW_DEFAULT;
      } catch (e) {
        return ADMIN_PW_DEFAULT;
      }
    }

    function goPanel() {
      var p2 = (location.pathname || '/').replace(/\/+$/, '') || '/';
      var base = p2.replace(/\/admin(\/index\.html)?$/i, '');
      var panel = base + '/admin/panel';
      if (location.hostname.indexOf('github.io') !== -1) panel += '/';
      window.location.replace(panel);
    }

    let googleClientInited = null;
    function loadGsi() {
      if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.defer = true;
        s.onload = function () { resolve(); };
        s.onerror = function () { reject(new Error('gsi')); };
        document.head.appendChild(s);
      });
    }

    async function setupGoogleSignIn() {
      var section = document.getElementById('google-section');
      var host = document.getElementById('google-btn-host');
      var gErr = document.getElementById('google-err');
      if (!section || !host) return;
      try {
        var r = await fetch('/api/auth/google-config');
        var cfg = await r.json();
        if (!cfg || !cfg.enabled || !cfg.clientId) {
          section.style.display = 'none';
          host.innerHTML = '';
          return;
        }
        section.style.display = 'block';
        await loadGsi();
        if (googleClientInited !== cfg.clientId) {
          google.accounts.id.initialize({
            client_id: cfg.clientId,
            callback: function (response) {
              onGoogleCredential(response, gErr);
            },
            auto_select: false,
            cancel_on_tap_outside: true,
          });
          googleClientInited = cfg.clientId;
        }
        host.innerHTML = '';
        google.accounts.id.renderButton(host, {
          theme: 'filled_black',
          size: 'large',
          width: 280,
          text: 'continue_with',
          locale: 'ka',
        });
      } catch (e) {
        section.style.display = 'none';
        host.innerHTML = '';
      }
    }

    async function onGoogleCredential(response, errEl) {
      if (errEl) {
        errEl.style.display = 'none';
        errEl.textContent = '';
      }
      if (!response || !response.credential) return;
      try {
        var r = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential }),
        });
        var data = await r.json().catch(function () { return {}; });
        if (!r.ok || !data.ok) {
          if (errEl) {
            errEl.textContent = (data && data.error) ? String(data.error) : 'Google შესვლა ვერ მოხერხდა';
            errEl.style.display = 'block';
          }
          return;
        }
        sessionStorage.setItem('tiflis_admin_logged', '1');
        sessionStorage.setItem('tiflis_admin_stay', '1');
        goPanel();
      } catch (e) {
        if (errEl) {
          errEl.textContent = 'ქსელის შეცდომა — გაუშვით npm start (სერვერი) და სცადეთ თავიდან';
          errEl.style.display = 'block';
        }
      }
    }

    setupGoogleSignIn();

    const form = document.getElementById('login-form');
    const pwEl = document.getElementById('pw');
    const errEl = document.getElementById('err');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.remove('show');
      btn.disabled = true;
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwEl.value }),
        });
        const ok = response.ok;
        if (ok) {
          sessionStorage.setItem('tiflis_admin_logged', '1');
          sessionStorage.setItem('tiflis_admin_stay', '1');
          goPanel();
        } else {
          errEl.classList.add('show');
          pwEl.value = '';
          pwEl.focus();
        }
      } catch (err) {
        errEl.textContent = 'კავშირის შეცდომა';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
      }
    });
    pwEl.focus();
  </script>
</body>
</html>
