<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ადმინი — Tiflisi</title><link rel="stylesheet" href="/styles.css"><style>body{background:#10201d;color:#fff}.admin-shell{max-width:1180px;margin:auto;padding:3rem 5vw}.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}.admin-header h1{font:500 2.6rem 'Playfair Display';margin:0}.admin-card{background:#18332e;padding:1.5rem;border:1px solid rgba(255,255,255,.12);margin-bottom:1rem}.admin-toolbar{display:flex;gap:1rem;align-items:end;flex-wrap:wrap}.admin-toolbar label{color:#b8c8c0;margin:0;min-width:190px}.admin-table{width:100%;border-collapse:collapse;font-size:.78rem}.admin-table th,.admin-table td{padding:.8rem .5rem;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}.admin-table th{color:#e29a70;font-weight:600}.status{border-radius:99px;padding:.2rem .55rem;font-size:.68rem}.status-pending{background:#6a5431}.status-confirmed{background:#23645b}.status-cancelled{background:#693c39}.admin-login{max-width:400px;margin:15vh auto;padding:2rem;background:#18332e}.admin-login h1{font:500 2rem 'Playfair Display'}.admin-login input{background:#fff}.error{color:#e29a70;min-height:1.5rem}.small-button{padding:.35rem .6rem;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:99px;cursor:pointer}.hidden{display:none!important}</style></head><body><div id="login-view" class="admin-login"><p class="eyebrow">TIFLISI · ADMIN</p><h1>რეზერვაციების მართვა</h1><form id="login-form"><label>პაროლი<input id="password" type="password" required></label><button class="button button-accent" type="submit">შესვლა →</button><p id="login-error" class="error"></p></form></div><div id="dashboard" class="admin-shell hidden"><header class="admin-header"><div><p class="eyebrow">TIFLISI · CONTROL ROOM</p><h1>დღის რეზერვაციები</h1></div><div><a class="button button-accent" href="/">საიტზე ↗</a> <button id="logout" class="small-button">გასვლა</button></div></header><section class="admin-card"><div class="admin-toolbar"><label>თარიღი<input id="admin-date" type="date"></label><button id="load" class="button button-accent">განახლება</button><span id="summary" class="muted"></span></div></section><section class="admin-card"><div style="overflow:auto"><table class="admin-table"><thead><tr><th>დრო</th><th>სტუმარი</th><th>ტელეფონი</th><th>სტუმრები</th><th>მაგიდა</th><th>სტატუსი</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script src="/admin.js" type="module"></script></body></html>
