<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>რეზერვაციები — Tiflisi</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Noto+Serif+Georgian:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light only; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #F6F3EF; color: #252724; font-family: "Noto Sans Georgian", system-ui, sans-serif; }
  .hidden { display: none !important; }
  .login {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: linear-gradient(180deg, rgba(166,75,60,.06), transparent 220px), #F6F3EF;
  }
  .login-card { width: min(420px, 100%); padding: 28px; border-radius: 8px; background: #fff; color: #252724; border: 1px solid #E7E1DA; box-shadow: 0 12px 32px rgba(37,39,36,.06); }
  .mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 6px; background: #A64B3C; color: #fff; font-family: "Noto Serif Georgian", Georgia, serif; font-size: 1.15rem; }
  .login-card h1, .workspace h1 { margin: 10px 0 6px; font-family: "Noto Serif Georgian", Georgia, serif; font-weight: 650; letter-spacing: -.03em; }
  .login-card p, .sub { margin: 0 0 16px; color: #77766F; line-height: 1.5; }
  label { display: grid; gap: 6px; margin-bottom: 12px; font-size: 12px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; color: #77766F; }
  input, button { font: inherit; }
  input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 6px; border: 1px solid #D8D1C8; background: #fff; color: #252724; }
  .workspace input { background: #fff; color: #252724; border-color: #D8D1C8; }
  button, .button { min-height: 40px; padding: 0 14px; border-radius: 6px; border: 0; background: #A64B3C; color: #fff; font-weight: 750; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button:hover, .button:hover { background: #84392F; }
  .ghost { background: #fff; color: #217B76; border: 1px solid #C5E4E1; }
  .ghost:hover { background: #F3FBFA; }
  .login-card button { width: 100%; justify-content: center; }
  .error { min-height: 1.2rem; color: #84392F; }
  .app { min-height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
  aside { background: #fff; color: #252724; padding: 22px 16px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid #E7E1DA; }
  aside strong { display: block; font-size: 1.05rem; }
  aside span { color: #77766F; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .workspace { padding: 22px; min-width: 0; }
  header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
  .toolbar, .table-card { background: #fff; border: 1px solid #E7E1DA; border-radius: 8px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; padding: 14px; margin-bottom: 14px; }
  .toolbar label { color: #77766F; }
  .table-card { overflow: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #F0EBE4; font-size: 14px; }
  th { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #77766F; background: #F7F4F0; }
  .status { border-radius: 4px; padding: 4px 8px; font-size: 12px; font-weight: 750; }
  .status-pending { background: #F8F1E4; color: #6E4E16; }
  .status-confirmed { background: #E7F5F4; color: #217B76; }
  .status-seated { background: #F8EBE7; color: #84392F; }
  .status-completed { background: #EEE9E2; color: #3c3b36; }
  .status-cancelled, .status-no_show { background: #F8EBE7; color: #84392F; }
  .small-button { min-height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #C5E4E1; background: #fff; color: #217B76; font-weight: 700; cursor: pointer; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    aside { flex-direction: row; align-items: center; justify-content: space-between; }
    .workspace { padding: 14px; }
    header { align-items: stretch; flex-direction: column; }
  }
  @media (orientation: landscape) and (min-width: 640px) {
    .app { grid-template-columns: 200px minmax(0, 1fr); }
    aside { flex-direction: column; align-items: flex-start; justify-content: flex-start; }
    header { flex-direction: row; align-items: flex-end; }
  }
</style>
</head>
<body>
  <div id="login-view" class="login">
    <form id="login-form" class="login-card">
      <div class="mark" aria-hidden="true">T</div>
      <h1>რეზერვაციები</h1>
      <p>დღის სია, სტატუსები და სტუმრის დადასტურება.</p>
      <label>პაროლი<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="button" type="submit">შესვლა</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>
  <div id="dashboard" class="app hidden">
    <aside>
      <div><div class="mark" aria-hidden="true">T</div><strong>ტიფლისი</strong><span>რეზერვაციები</span></div>
    </aside>
    <main class="workspace">
      <header>
        <div>
          <h1>დღის რეზერვაციები</h1>
          <p class="sub" id="summary"></p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <a class="button ghost" href="/admin/panel">სრული პანელი</a>
          <a class="button ghost" href="/">საიტი</a>
          <button id="logout" class="button" type="button">გასვლა</button>
        </div>
      </header>
      <section class="toolbar">
        <label>თარიღი<input id="admin-date" type="date"></label>
        <button id="load" class="button" type="button">განახლება</button>
      </section>
      <section class="table-card">
        <table>
          <thead><tr><th>დრო</th><th>სტუმარი</th><th>ტელეფონი</th><th>სტუმრები</th><th>მაგიდა</th><th>სტატუსი</th><th>ქმედება</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="/admin.js" type="module"></script>
</body>
</html>
